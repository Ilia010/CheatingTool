name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish CheatingTool.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath CheatingTool-win-x64.zip -Force
          $size = [math]::Round((Get-Item CheatingTool-win-x64.zip).Length / 1MB, 1)
          Write-Host "Archive size: $size MB"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: CheatingTool-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
